# DV platform — Nginx site configuration (include inside the http {} block, e.g. /etc/nginx/conf.d/dv.conf).
#
# Two listeners:
#   PUBLIC   0.0.0.0:8080  (dev; production terminates TLS on 443)  → /api/v1/* only
#   INTERNAL 127.0.0.2:80  (dev stand-in for the private interface, e.g. 10.0.0.5:80)
#            → svc-core.internal, svc-verification.internal, svc-notification.internal
# Node processes bind to 127.0.0.1:3001-3003 and are never reachable from outside the host.
# The internal listener is not a security boundary on its own: every internal endpoint also requires a
# service token from an allowed client, and the firewall must block the internal port from outside.

upstream dv_core         { server 127.0.0.1:3001 max_fails=0; keepalive 16; }
upstream dv_verification { server 127.0.0.1:3002 max_fails=0; keepalive 16; }
upstream dv_notification { server 127.0.0.1:3003 max_fails=0; keepalive 16; }

# Generate a request id at the edge when the caller sent none; pass the caller's otherwise.
map $http_x_request_id $dv_request_id {
  default   $http_x_request_id;
  ""        $request_id;
}

log_format dv_json escape=json '{"time":"$time_iso8601","listener":"$server_name","remote":"$remote_addr",'
  '"method":"$request_method","uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
  '"duration_s":$request_time,"upstream_s":"$upstream_response_time","request_id":"$dv_request_id",'
  '"traceparent":"$http_traceparent"}';

# ------------------------------------------------------------------------------------------------
# PUBLIC listener
# ------------------------------------------------------------------------------------------------
server {
  listen 8080 default_server;
  server_name _;
  access_log /var/log/nginx/dv-public.access.log dv_json;

  client_max_body_size 64k;
  server_tokens off;

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Request-ID $dv_request_id;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_connect_timeout 2s;
  proxy_send_timeout 10s;
  proxy_read_timeout 10s;
  # Never replay a POST on another upstream: the application decides about retries.
  proxy_next_upstream off;

  # Internal APIs are never exposed publicly.
  location ^~ /internal/ { return 404; }

  location = /api/v1/companies          { proxy_pass http://dv_core; }
  location ^~ /api/v1/companies/        { proxy_pass http://dv_core; }
  location = /api/v1/me                 { proxy_pass http://dv_core; }
  location ^~ /api/v1/me/               { proxy_pass http://dv_core; }
  location ^~ /api/v1/admin/verifications/ { proxy_pass http://dv_verification; }
  location = /api/v1/notifications      { proxy_pass http://dv_notification; }

  location / {
    default_type application/json;
    return 404 '{"statusCode":404,"code":"NOT_FOUND","message":"Not found."}';
  }

  error_page 502 503 504 = @upstream_unavailable;
  location @upstream_unavailable {
    default_type application/json;
    return 503 '{"statusCode":503,"code":"SERVICE_UNAVAILABLE","message":"The service is temporarily unavailable."}';
  }
}

# ------------------------------------------------------------------------------------------------
# INTERNAL listener (private interface only)
# ------------------------------------------------------------------------------------------------
server {
  listen 127.0.0.2:80 default_server;
  server_name _;
  return 444;
}

server {
  listen 127.0.0.2:80;
  server_name svc-core.internal;
  include /etc/nginx/snippets/dv-internal-common.conf;
  location ^~ /internal/ { proxy_pass http://dv_core; }
  location = /health     { proxy_pass http://dv_core; }
  location = /ready      { proxy_pass http://dv_core; }
  location / { return 404; }
}

server {
  listen 127.0.0.2:80;
  server_name svc-verification.internal;
  include /etc/nginx/snippets/dv-internal-common.conf;
  location ^~ /internal/ { proxy_pass http://dv_verification; }
  location = /health     { proxy_pass http://dv_verification; }
  location = /ready      { proxy_pass http://dv_verification; }
  location / { return 404; }
}

server {
  listen 127.0.0.2:80;
  server_name svc-notification.internal;
  include /etc/nginx/snippets/dv-internal-common.conf;
  location ^~ /internal/ { proxy_pass http://dv_notification; }
  location = /health     { proxy_pass http://dv_notification; }
  location = /ready      { proxy_pass http://dv_notification; }
  location / { return 404; }
}
