# Shared settings for the internal virtual hosts (install as /etc/nginx/snippets/dv-internal-common.conf).
access_log /var/log/nginx/dv-internal.access.log dv_json;

# Only hosts on the private network may connect. Adjust to your private CIDR.
allow 127.0.0.0/8;
allow 10.0.0.0/8;
deny all;

client_max_body_size 64k;
server_tokens off;

proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Request-ID $dv_request_id;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
# Fail fast when a service is down so callers see the outage within their own timeout.
proxy_connect_timeout 1s;
proxy_send_timeout 5s;
proxy_read_timeout 5s;
proxy_next_upstream off;
